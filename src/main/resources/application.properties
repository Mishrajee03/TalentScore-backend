spring.application.name=talentscore

# Production-Grade Cloud Database Configurations
spring.datasource.url=jdbc:h2:file:/data/talentscore_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.hibernate.dialect.H2Dialect
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Automated Table Synchronization DDL Rules
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Bind the server port dynamically to whatever the cloud platform assigns
server.port=${PORT:8080}